<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Safeguard for environments/extensions attempting to override window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(fn) {
              activeFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
    </script>
